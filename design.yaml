design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 0.3in
    bottom_margin: 0.3in
    left_margin: 0.3in
    right_margin: 0.3in
    show_footer: false
    show_top_note: false

  colors:
    name: rgb(12, 42, 90)
    section_titles: rgb(12, 42, 90)
    links: rgb(12, 42, 90)
    headline: rgb(60, 60, 60)
    connections: rgb(45, 45, 45)
    body: rgb(10, 10, 10)
    footer: rgb(130, 130, 130)
    top_note: rgb(130, 130, 130)

  typography:
    line_spacing: 0.68em
    alignment: justified-with-no-hyphenation
    date_and_location_column_alignment: right
    font_family:
      name: EB Garamond
      body: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      name: 21pt
      body: 9.9pt
      headline: 9.9pt
      connections: 9.4pt
      section_titles: 1.05em
    small_caps:
      name: true
      headline: false
      connections: false
      section_titles: false
    bold:
      name: false
      headline: false
      connections: false
      section_titles: false

  links:
    underline: false
    show_external_link_icon: false

  header:
    alignment: center
    space_below_name: 0.35cm
    space_below_headline: 0.28cm
    space_below_connections: 0.38cm
    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: "·"
      space_between_connections: 0.25cm

  section_titles:
    type: centered_with_centered_partial_line
    line_thickness: 0.42pt
    space_above: 0.42cm
    space_below: 0.22cm

  sections:
    allow_page_break: false
    space_between_regular_entries: 0.35cm
    space_between_text_based_entries: 0.13cm
    show_time_spans_in: []

  entries:
    date_and_location_width: 4.15cm
    side_space: 0cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0.08cm
      space_left: 0cm
    highlights:
      bullet: "-"
      nested_bullet: "◦"
      space_left: 0cm
      space_above: 0.09cm
      space_between_items: 0.09cm
      space_between_bullet_and_text: 0.4em

  templates:
    footer: "*NAME -- PAGE_NUMBER/TOTAL_PAGES*"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE_WITH_AREA · LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME** · LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **POSITION**, COMPANY · LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
