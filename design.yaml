design:
  theme: engineeringresumes

  page:
    size: a4
    top_margin: 0.4in
    bottom_margin: 0.4in
    left_margin: 0.4in
    right_margin: 0.4in
    show_footer: false
    show_top_note: true

  colors:
    name: rgb(20, 52, 84)
    section_titles: rgb(20, 52, 84)
    links: rgb(20, 52, 84)

    headline: rgb(70, 70, 74)
    connections: rgb(88, 88, 92)
    body: rgb(28, 28, 30)

    footer: rgb(130, 130, 135)
    top_note: rgb(130, 130, 135)

  typography:
    line_spacing: 0.74em
    alignment: left
    date_and_location_column_alignment: right

    font_family:
      name: Source Sans 3
      body: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3

    font_size:
      name: 20pt
      body: 9pt
      headline: 9pt
      connections: 9.1pt
      section_titles: 1.4em

    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: true

    bold:
      name: true
      headline: false
      connections: false
      section_titles: false

  links:
    underline: false
    show_external_link_icon: false

  header:
    alignment: left
    space_below_name: 0.3cm
    space_below_headline: 0.18cm
    space_below_connections: 0.34cm

    connections:
      phone_number_format: E164
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: "·"
      space_between_connections: 0.3cm

  section_titles:
    type: with_full_line
    line_thickness: 0.42pt
    space_above: 0.34cm
    space_below: 0.18cm

  sections:
    allow_page_break: false
    space_between_regular_entries: 0.34cm
    space_between_text_based_entries: 0.12cm
    show_time_spans_in: []

  entries:
    date_and_location_width: 3.35cm
    side_space: 0cm
    space_between_columns: 0.14cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm

    summary:
      space_above: 0.05cm
      space_left: 0cm

    highlights:
      bullet: "•"
      nested_bullet: "◦"
      space_left: 0cm
      space_above: 0.09cm
      space_between_items: 0.09cm
      space_between_bullet_and_text: 0.42em

  templates:
    footer: "*NAME — PAGE_NUMBER/TOTAL_PAGES*"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS

    one_line_entry:
      main_column: "**LABEL:** DETAILS"

    experience_entry:
      main_column: |-
        **POSITION** · **COMPANY** · LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE

    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE

    education_entry:
      main_column: |-
        **INSTITUTION** · DEGREE_WITH_AREA · LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE

    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
