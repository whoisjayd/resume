design:
  theme: engineeringresumes

  page:
    size: a4
    top_margin: 0.4in
    bottom_margin: 0.35in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: false
    show_top_note: false

  colors:
    name: rgb(14, 42, 74)
    section_titles: rgb(14, 42, 74)
    links: rgb(31, 84, 140)

    headline: rgb(60, 64, 72)
    connections: rgb(80, 84, 92)
    body: rgb(26, 26, 28)

    footer: rgb(130, 130, 135)
    top_note: rgb(130, 130, 135)

  typography:
    line_spacing: 0.66em
    alignment: left
    date_and_location_column_alignment: right

    font_family:
      name: Source Sans 3
      body: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3

    font_size:
      name: 23pt
      body: 9.2pt
      headline: 10.4pt
      connections: 9pt
      section_titles: 1.2em

    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: true

    bold:
      name: true
      headline: false
      connections: false
      section_titles: true

  links:
    underline: false
    show_external_link_icon: false

  header:
    alignment: left
    space_below_name: 0.22cm
    space_below_headline: 0.16cm
    space_below_connections: 0.28cm

    connections:
      phone_number_format: E164
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: "·"
      space_between_connections: 0.35cm

  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.24cm
    space_below: 0.16cm

  sections:
    allow_page_break: false
    space_between_regular_entries: 0.22cm
    space_between_text_based_entries: 0.1cm
    show_time_spans_in: []

  entries:
    date_and_location_width: 4.1cm
    side_space: 0cm
    space_between_columns: 0.15cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm

    summary:
      space_above: 0.04cm
      space_left: 0cm

    highlights:
      bullet: "•"
      nested_bullet: "◦"
      space_left: 0.05cm
      space_above: 0.08cm
      space_between_items: 0.07cm
      space_between_bullet_and_text: 0.45em

  templates:
    footer: "*NAME — PAGE_NUMBER/TOTAL_PAGES*"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS

    one_line_entry:
      main_column: "**LABEL:** DETAILS"

    experience_entry:
      main_column: |-
        **COMPANY** · *POSITION*
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE

    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE

    education_entry:
      main_column: |-
        **INSTITUTION** · DEGREE_WITH_AREA
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE

    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
