name: Feature request
description: Suggest an improvement to the resume template or contributor experience.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
      description: Explain the use case and who benefits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or interface you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share other approaches or workarounds.
