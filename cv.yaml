          - "Wrote the async Python backend: device provisioning, JWT/device auth,
            MQTT command routing, live state updates, telemetry history."

          - "Deployed on Google Cloud Run; hardened device connectivity with MQTT
            over TLS, reconnect with backoff and OTA updates."

      - company: "Team Dyaus, Nirma University"
