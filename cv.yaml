  sections:
    summary:
      - "Python engineer focused on LLM-powered tools and the backend systems
        around them. I build, publish and maintain my own software: two
        packages on PyPI, an IoT backend, and flight and vision software for
        national and international robotics competitions."

    projects:
      - name: "NoteWise: LLM study-notes CLI"
        date: "[GitHub](https://github.com/whoisjayd/notewise) |
          [Docs](https://notewise.click/docs) |
          [PyPI](https://pypi.org/project/notewise/)"
        highlights:
          - "Built and maintain an open-source async Python CLI that turns
            YouTube lectures and playlists into structured Markdown, HTML, PDF
            and DOCX notes with quizzes. 16 releases since March 2026 (v1.0 to
            v1.7), 258 commits, 10 stars and 13 forks."

          - "Solved long-input limits by splitting transcripts into 4,000-token
            chunks with 200-token overlap, then stitching them at heading and
            code-block boundaries so the output reads as one document."

          - "Routes requests across LLM providers (Gemini, Claude, OpenAI, Groq,
            local Ollama) through LiteLLM, with exponential backoff and jitter,
            token and cost tracking, and a SQLite cache that skips repeat
            transcript fetches."

          - "Ships like a product: typed codebase, tests with CI and coverage
            tracking, docs site, standalone installers and a Docker image."

      - name: "GitResume: repository-grounded resume assistant"
        date: "[Project page](https://jaydeep.is-a.dev/projects/gitresume)"
        highlights:
          - "Built an AI tool that takes a GitHub repository and a job
            description and produces resume bullets, project summaries and
            interview questions grounded in the code, without inventing
            achievements."

          - "Used Tree-sitter to extract structure and stack from real code
            instead of keyword matching; streamed long analyses over
            WebSockets, added GitHub OAuth for private repos, Redis for session
            state and swappable model providers."

      - name: "BlazeServe: high-throughput HTTP file server"
        date: "[GitHub](https://github.com/whoisjayd/blazeserve) |
          [PyPI](https://pypi.org/project/blazeserve/)"
        highlights:
          - "Built and published a Python HTTP/1.1 file server that keeps memory
            flat on multi-GB files: zero-copy sendfile for full downloads,
            256 MB sliding-window mmap for range requests and a bounded
            buffered fallback."

          - "Implemented the protocol details instead of skipping them:
            resumable single and multi-range downloads (RFC 7233), conditional
            caching with ETag and 304 responses, and per-IP token-bucket rate
            limiting with 429 responses."

          - "Added Prometheus metrics plus built-in doctor and benchmark commands;
            checked with Ruff, strict mypy and pytest."

